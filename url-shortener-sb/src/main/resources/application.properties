spring.application.name=url-shortner-sb

# Load local env file if present (keeps deployment env vars as the source of truth)
# Supports running from repo root or module directory
spring.config.import=optional:file:./url-shortener-sb/.env[.properties],optional:file:.env[.properties]

# DB configuration. Local values should come from .env or environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

server.port=${PORT:8080}
server.servlet.context-path=/api/v1

frontend.url=${FRONTEND_URL}
